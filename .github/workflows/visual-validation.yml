name: Visual validation
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: visual-${{ github.ref }}
  cancel-in-progress: true
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run validate:visual
      - name: Build evidence gallery
        if: always()
        run: node scripts/summarize-validation.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aether-visual-${{ github.sha }}
          path: validation-results/
          retention-days: 30
          if-no-files-found: error
