name: Test and deploy Aether
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: aether-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    with:
      full: ${{ github.event_name == 'workflow_dispatch' }}
      publish: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
      base: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
      head: ${{ github.event.pull_request.head.sha || github.sha }}

  deploy:
    needs: checks
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.checks.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish the already tested artifact
        id: deployment
        uses: actions/deploy-pages@v4
